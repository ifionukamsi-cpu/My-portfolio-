<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent To-Do App</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
      margin: 0;
    }

    .card {
      background-color: #1e293b;
      padding: 1.5rem;
      border-radius: 12px;
      width: 90%;
      max-width: 380px;
    }

    h2 { margin-top: 0; color: #38bdf8; }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 1rem;
    }

    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #fff;
      font-size: 1rem;
    }

    button.add-btn {
      padding: 10px 16px;
      background-color: #38bdf8;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      color: #0f172a;
      cursor: pointer;
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      background-color: #334155;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    span { cursor: pointer; flex: 1; }
    .completed { text-decoration: line-through; opacity: 0.6; }

    .delete-btn {
      background-color: #ef4444;
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>My Tasks</h2>
    <div class="input-group">
      <input type="text" id="task-input" placeholder="Add a new task...">
      <button class="add-btn" id="add-btn">Add</button>
    </div>
    <ul id="task-list"></ul>
  </div>

  <script>
    var input = document.getElementById('task-input');
    var addBtn = document.getElementById('add-btn');
    var taskList = document.getElementById('task-list');

    window.onload = function() {
      loadTasks();
    };

    function addTask() {
      var taskText = input.value.trim();
      if (taskText === "") return;
      createTaskElement(taskText);
      saveTaskToStorage(taskText);
      input.value = '';
    }

    function createTaskElement(text) {
      var li = document.createElement('li');
      var span = document.createElement('span');
      span.innerText = text;

      span.onclick = function() {
        span.classList.toggle('completed');
      };

      var deleteBtn = document.createElement('button');
      deleteBtn.innerText = 'X';
      deleteBtn.className = 'delete-btn';

      deleteBtn.onclick = function() {
        li.remove();
        removeTaskFromStorage(text);
      };

      li.appendChild(span);
      li.appendChild(deleteBtn);
      taskList.appendChild(li);
    }

    function getTasksFromStorage() {
      var tasks = localStorage.getItem('myTasks');
      return tasks ? JSON.parse(tasks) : [];
    }

    function saveTaskToStorage(task) {
      var tasks = getTasksFromStorage();
      tasks.push(task);
      localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    function removeTaskFromStorage(taskToRemove) {
      var tasks = getTasksFromStorage();
      var updated = tasks.filter(function(item) {
        return item !== taskToRemove;
      });
      localStorage.setItem('myTasks', JSON.stringify(updated));
    }

    function loadTasks() {
      var tasks = getTasksFromStorage();
      for (var i = 0; i < tasks.length; i++) {
        createTaskElement(tasks[i]);
      }
    }

    addBtn.onclick = addTask;
    input.onkeypress = function(e) {
      if (e.key === 'Enter') addTask();
    };
  </script>

</body>
</html>
